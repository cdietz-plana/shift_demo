<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift Coverage · Standard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/flow.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
html,body{height:100%;overflow:hidden;background:#eef3f8}
#app{position:absolute;left:var(--x,0px);top:var(--y,0px);width:1600px;height:900px;transform:scale(var(--s,1));transform-origin:0 0;font-family:Inter,system-ui,sans-serif;color:#0f2233;
  background:radial-gradient(ellipse at 50% 0%,#ffffff 0%,#f2f6fa 55%,#e7eef5 100%);overflow:hidden}
/* header */
.top{position:absolute;left:36px;right:36px;top:18px;height:52px;display:flex;align-items:center;gap:14px;z-index:30}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo .m{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#0ea5a4,#2563eb);color:#fff;font-weight:900;font-size:13px;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.logo .brand{display:none;height:70px;margin-top:6px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}.photo .logo .brand{display:block}.photo .logo .m,.photo .logo .lt{display:none}
.logo b{display:block;font-size:17px}.logo small{display:block;font-size:12px;color:#4b6175}
.sp{flex:1}
.user{display:flex;align-items:center;gap:10px;font-size:13px}.user .av{width:36px;height:36px;border-radius:50%;background:#e0f2f1;color:#0b7a78;display:grid;place-items:center;font-weight:800;font-size:12px}
.user small{display:block;font-size:11px;color:#4b6175}
/* time navigation */
.tnav{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:31;background:#fff;border:1px solid #d9e3ec;border-radius:16px;padding:6px;box-shadow:0 8px 24px rgba(15,34,51,.06)}
.tnav .ar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:#334155}.tnav .ar:hover{background:#f1f5f9}
.tnav .tl{min-width:220px;text-align:center;line-height:1.15}.tnav .tl b{font-size:14px;display:block}.tnav .tl small{font-size:11px;color:#64748b}
.tnav .tl small.proj{color:#b45309}
.seg{display:flex;gap:2px;padding:3px;border-radius:11px;background:#f1f5f9}
.seg button{font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:8px;color:#475569}
.seg button.on{background:#fff;color:#0f2233;box-shadow:0 1px 3px rgba(15,34,51,.15)}
.today{font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:10px;color:#2563eb}
.today:hover{background:#eff6ff}
/* carousel nav */
.hnav{position:absolute;left:50%;top:86px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border:1px solid #d9e3ec;box-shadow:0 8px 24px rgba(15,34,51,.08);z-index:30}
.hnav button{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:600;color:#4b6175;position:relative;z-index:1;transition:color .35s}
.hnav button svg{width:16px;height:16px}
.hnav button.on{color:#fff}
.hnav .ind{position:absolute;top:5px;bottom:5px;border-radius:999px;background:linear-gradient(135deg,#0ea5a4,#2563eb);box-shadow:0 6px 16px rgba(37,99,235,.3);transition:all .6s cubic-bezier(.65,0,.35,1)}
.hnav .badge{min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 5px}
#stage{position:absolute;inset:0;perspective:1900px;perspective-origin:50% 45%}
.panel{position:absolute;width:1100px;height:620px;left:250px;top:156px;border-radius:24px;background:#fff;border:1px solid #d9e3ec;box-shadow:0 30px 60px rgba(15,34,51,.1);
  transition:transform 1s cubic-bezier(.65,0,.35,1),opacity 1s,filter 1s;overflow:hidden}
.panel.off{-webkit-box-reflect:below 14px linear-gradient(transparent 85%,rgba(255,255,255,.2))}
.panel.off{cursor:pointer}.panel.off *{pointer-events:none}
.panel .in{position:absolute;inset:0;padding:22px 26px;display:flex;flex-direction:column}
.ph{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.ph h2{font-size:24px;font-weight:800;letter-spacing:-.3px}.ph p{font-size:13px;color:#4b6175;margin-top:3px}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;font-size:12px;color:#64748b}
.draftlbl{position:absolute;right:36px;bottom:22px;font-size:11px;color:#94a3b8}
/* buttons, chips, pills */
.btn{font-size:13px;font-weight:700;padding:9px 15px;border-radius:11px;background:#f1f5f9;color:#0f2233;white-space:nowrap;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.4;transform:none;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,#0ea5a4,#2563eb);color:#fff;box-shadow:0 6px 14px rgba(37,99,235,.25)}
.btn.sm{font-size:12px;padding:6px 11px;border-radius:9px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-DRAFT{background:#eef2f7;color:#334155}.s-PENDING_APPROVAL{background:#ede9fe;color:#5b21b6}.s-READY_FOR_OUTREACH{background:#cffafe;color:#0e7490}
.s-OUTREACH_IN_PROGRESS{background:#dbeafe;color:#1d4ed8}.s-PARTIALLY_FILLED{background:#fef3c7;color:#92400e}.s-FILLED{background:#d1fae5;color:#065f46}
.s-UNABLE_TO_FILL{background:#ffe4e6;color:#9f1239}.s-PROJECTED{background:#fff7ed;color:#b45309;border:1px dashed #fdba74}.s-DECISION{background:#fee2e2;color:#b91c1c}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:#f1f5f9;color:#475569;border:1px solid transparent}
.chips button.on{background:#e0f2fe;color:#0369a1;border-color:#bae6fd}
.chips button em{font-style:normal;font-weight:800;margin-left:4px;opacity:.7}
.tb{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:11px;border:1px solid #d9e3ec;background:#f8fafc;width:220px}
.search svg{width:16px;height:16px;flex:0 0 16px;color:#94a3b8}
.search input{border:0;background:none;outline:0;font-size:13px;width:100%}
select.sel{font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:10px;border:1px solid #d9e3ec;background:#fff;outline:0}
/* tables */
.tw{flex:1;min-height:0;overflow:auto;border:1px solid #e6edf3;border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:#f8fafc;text-align:left;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#64748b;padding:10px 12px;border-bottom:1px solid #e6edf3;white-space:nowrap;z-index:1}
thead th small{display:block;margin-top:1px}
thead th.sort{cursor:pointer}thead th.sort:hover{color:#0f2233}thead th .ar{opacity:.5;margin-left:4px}
tbody td{white-space:nowrap;padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:hover{background:#f8fbff}
tbody tr.proj td{color:#64748b}
td small{display:block;font-size:11.5px;color:#64748b;margin-top:1px}
td.num{font-variant-numeric:tabular-nums}
.prog{display:flex;align-items:center;gap:8px}.prog i{width:70px;height:6px;border-radius:3px;background:#e2e8f0;overflow:hidden;display:block}.prog i u{display:block;height:100%;background:linear-gradient(90deg,#10b981,#0ea5a4)}
input[type=checkbox]{width:15px;height:15px;accent-color:#2563eb}
.empty{padding:40px;text-align:center;color:#64748b;font-size:13px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#f1f5f9;color:#475569;margin:1px 3px 1px 0}
.tag.warn{background:#fef3c7;color:#92400e}.tag.ok{background:#d1fae5;color:#065f46}.tag.no{background:#ffe4e6;color:#9f1239}
.hrs{display:flex;align-items:center;gap:8px}.hrs i{width:80px;height:6px;border-radius:3px;background:#e2e8f0;overflow:hidden;display:block;position:relative}.hrs i u{display:block;height:100%;background:#0ea5a4}.hrs i u.hot{background:#f59e0b}
.av2{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:800;background:#e0f2f1;color:#0b7a78;margin-right:9px;vertical-align:middle}
/* overview */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{border:1px solid #e6edf3;border-radius:16px;padding:12px 16px;background:linear-gradient(180deg,#fff,#f8fbfe)}
.kpi small{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#64748b}
.kpi b{display:block;font-size:28px;font-weight:800;margin-top:2px;letter-spacing:-.5px}.kpi em{font-style:normal;font-size:12px;color:#64748b}
.ov{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;flex:1;min-height:0}
.card{border:1px solid #e6edf3;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;min-height:0}
.card h3{font-size:14.5px;font-weight:800}.card .s{font-size:12px;color:#64748b;margin-top:2px}
.list{flex:1;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid #eef2f7;background:#fbfdff}
.cell.fc{background:#eef2ff;color:#4f46e5}.dark .cell.fc{background:#1e1b4b;color:#a5b4fc}
.bar .tr u.okbar{background:#d1fae5}.dark .bar .tr u.okbar{background:#065f46}
#app{--bad:#be123c;--good:#047857;--proj:#b45309}#app.dark{--bad:#fb7185;--good:#34d399;--proj:#fdba74}
.dark .legend i{filter:brightness(.55) saturate(1.4)}
.decbar{margin-bottom:10px;background:#fff7f7;border-color:#fecdd3}
.dark .decbar{background:#2a0f16;border-color:#7f1d2d}
.li .tx{flex:1;min-width:0}.li .tx b{display:block;font-size:13px}.li .tx small{display:block;font-size:11.5px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{flex:1;overflow:auto;margin-top:10px}
.bar{display:grid;grid-template-columns:130px 1fr 64px;align-items:center;gap:10px;padding:6px 4px;font-size:12.5px;border-radius:8px}
.bar.click{cursor:pointer}.bar.click:hover{background:#f1f7ff}
.bar .tr{height:10px;border-radius:5px;background:#e2e8f0;position:relative;overflow:hidden}.bar .tr u{position:absolute;left:0;top:0;bottom:0;background:#0ea5a4;border-radius:5px}
.bar .tr u.gap{background:repeating-linear-gradient(45deg,#fda4af 0 4px,#fecdd3 4px 8px);left:auto;right:0}
.bar .tr u.proj{background:repeating-linear-gradient(45deg,#fdba74 0 4px,#ffedd5 4px 8px);left:auto;right:0}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.agent{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.agent .fo{position:relative;width:54px;height:54px;flex:0 0 54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#efe9ff,#8b6cff 45%,#3b1d9a);box-shadow:0 8px 20px rgba(124,92,255,.35)}
.agname{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#7c3aed;margin-bottom:2px}.dark .agname{color:#a78bfa}
.agent h2{font-size:24px;font-weight:800;letter-spacing:-.3px}.agent p{font-size:13.5px;color:#4b6175;margin-top:3px}
.sug{padding:12px 14px;border-radius:14px;border:1px solid #e0e7ff;background:linear-gradient(160deg,#f5f7ff,#f0fdfa)}
.sug .k{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#4f46e5}
.sug b{display:block;font-size:13.5px;margin-top:3px}.sug p{font-size:12px;color:#4b6175;margin-top:3px;line-height:1.45}
.sug .acts{display:flex;gap:6px;margin-top:8px}
.dmHint{display:flex;gap:8px;align-items:center;font-size:11.5px;color:#7c5a1a;padding:8px 10px;border-radius:10px;border:1px dashed #e9b860;background:#fff8e6;margin-top:8px;line-height:1.4}
.dmHint .dmBadge{color:#b45309;background:#fdecc8;border-color:#e9b860;flex:0 0 auto}
/* calendar grids */
.grid{flex:1;min-height:0;overflow:auto;border:1px solid #e6edf3;border-radius:14px}
.grid table td.c{text-align:center;padding:6px}
.cell{display:block;border-radius:9px;padding:8px 4px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;background:#ecfdf5;color:#047857;transition:transform .15s}
.cell.short{background:#fff1f2;color:#be123c;box-shadow:inset 0 0 0 1.5px #fda4af;cursor:pointer}.cell.short:hover{transform:scale(1.05)}
.cell.part{background:#fffbeb;color:#b45309;box-shadow:inset 0 0 0 1.5px #fcd34d;cursor:pointer}
.cell.proj{background:#fff7ed;color:#b45309;box-shadow:inset 0 0 0 1.5px dashed #fdba74;cursor:pointer;border:1.5px dashed #fdba74}
.cell.none{background:#f8fafc;color:#cbd5e1}
.cell small{display:block;font-size:10px;font-weight:600;opacity:.8;margin-top:1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;flex:1;min-height:0}
.cal .h{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#64748b;text-align:center}
.day{border-radius:12px;border:1px solid #e6edf3;padding:8px 10px;cursor:pointer;position:relative;background:#fff;transition:transform .15s,box-shadow .2s;min-height:82px}
.day:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(15,34,51,.08)}
.day .d{font-size:12px;font-weight:700;color:#475569}.day.today .d{color:#2563eb}
.day .n{position:absolute;right:8px;top:8px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px}
.day.l1{background:#fff7f7}.day.l2{background:#ffeef0}.day.l3{background:#ffe0e4}
.day.l1 .n,.day.l2 .n,.day.l3 .n{background:#e11d48;color:#fff}
.day.pj{background:repeating-linear-gradient(135deg,#fffaf3 0 8px,#fff4e6 8px 16px);border-style:dashed;border-color:#fdba74}.day.pj .n{background:#f59e0b;color:#fff}
.day .tm{display:flex;gap:3px;flex-wrap:wrap;margin-top:22px}.day .tm i{width:8px;height:8px;border-radius:50%}
.day .hl{font-size:10px;font-weight:700;color:#7c3aed;margin-top:4px}
.day.past{opacity:.55}
.legend{display:flex;gap:16px;font-size:11.5px;color:#64748b;margin-top:10px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
/* decision dialog (light) */
.dec{position:absolute;inset:0;z-index:400;display:grid;place-items:center;background:rgba(15,34,51,.28);backdrop-filter:blur(4px)}
.decb{width:540px;border-radius:22px;padding:22px 24px;background:#fff;border:1px solid #d9e3ec;box-shadow:0 40px 80px rgba(15,34,51,.25);border-top:4px solid var(--fa)}
.decb .k{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#64748b}.decb h3{font-size:20px;margin-top:6px}.decb .s{font-size:13px;color:#4b6175;margin-top:4px}
.dopt{display:block;width:100%;text-align:left;margin-top:10px;padding:13px 15px;border-radius:14px;border:1px solid #e6edf3;background:#f8fafc;position:relative}
.dopt:hover{border-color:#2563eb;background:#eff6ff}.dopt b{display:block;font-size:14px}.dopt span{display:block;font-size:12.5px;color:#4b6175;margin-top:3px;padding-right:96px}
.dopt .rec{position:absolute;right:12px;top:12px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;background:#d1fae5;color:#065f46}
#toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#0f2233;color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:12px;opacity:0;transition:all .35s;z-index:500;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
/* shared flow panel, light skin */
.gen .fl-dim{background:linear-gradient(90deg,rgba(15,34,51,.02),rgba(15,34,51,.22))}
.gen .fl-panel{color:#0f2233;background:#fff;border:1px solid #d9e3ec;box-shadow:0 30px 80px rgba(15,34,51,.22)}
.gen .fl-hd,.gen .fl-foot{border-color:#e6edf3}.gen .fl-hd .dot{box-shadow:none}
.gen .fl-ib{background:#f1f5f9;border-color:#e2e8f0;color:#0f2233}.gen .fl-ib.on{background:#e2e8f0}
.gen .fl-meta span,.gen .fl-chip{background:#f1f5f9}
.gen .fl-pill.DRAFT{background:#eef2f7;color:#334155}.gen .fl-pill.PENDING_APPROVAL{background:#ede9fe;color:#5b21b6}.gen .fl-pill.READY_FOR_OUTREACH{background:#cffafe;color:#0e7490}
.gen .fl-pill.OUTREACH_IN_PROGRESS{background:#dbeafe;color:#1d4ed8}.gen .fl-pill.PARTIALLY_FILLED{background:#fef3c7;color:#92400e}.gen .fl-pill.FILLED{background:#d1fae5;color:#065f46}.gen .fl-pill.UNABLE_TO_FILL{background:#ffe4e6;color:#9f1239}
.gen .fl-steps div::before{background:#e2e8f0}.gen .fl-steps div.cur::before{background:linear-gradient(90deg,var(--fa),#93c5fd);box-shadow:none}
.gen .fl-ag p,.gen .fl-msg,.gen .fl-kpis div{background:#f4f7fb;border-color:#e6edf3}
.gen .fl-quote{background:#f8fafc;border-color:#cbd5e1}.gen .fl-quote mark{color:#0f2233}
.gen .fl-quote mark.need{background:#fbcfe8}.gen .fl-quote mark.when{background:#a5f3fc}.gen .fl-quote mark.loc{background:#fde68a}.gen .fl-quote mark.role{background:#ddd6fe}
.gen .fl-card,.gen .fl-row,.gen .fl-cmpc{background:#f8fafc;border-color:#e6edf3}.gen .fl-cmpc.sel{background:#eff6ff;border-color:var(--fa)}
.gen .fl-card .v button,.gen .fl-row .av{background:#e2e8f0;color:#0f2233}
.gen .fl-seg button{background:#eef2f7;color:#0f2233}.gen .fl-seg button.on{background:var(--fa);color:#fff}
.gen .fl-btn{background:#eef2f7;color:#0f2233}.gen .fl-btn.pri{background:linear-gradient(135deg,#0ea5a4,#2563eb);color:#fff}.gen .fl-btn.acc{background:linear-gradient(135deg,#0ea5a4,#2563eb);color:#fff;box-shadow:0 6px 14px rgba(37,99,235,.25)}
.gen .fl-btn:disabled{opacity:.4}
.gen .fl-tag.ok{background:#d1fae5;color:#065f46}.gen .fl-tag.no{background:#ffe4e6;color:#9f1239}.gen .fl-tag.wait{background:#eef2f7;color:#475569}.gen .fl-tag.sent{background:#dbeafe;color:#1d4ed8}.gen .fl-tag.open{background:#ede9fe;color:#5b21b6}
.gen .fl-spin{border-color:#cbd5e1;border-top-color:#2563eb}
.gen .fl-bub{background:#e8eef6;color:#0f2233}.gen .fl-bub u{color:#2563eb}
.gen .fl-pol{background:#fffbeb;border-color:#fde68a}.gen .fl-pol b{color:#92400e}
.gen .fl-cmpc .rec{background:#fef3c7;color:#92400e}
.gen .fl-fac div{background:#eef2f7}.gen .fl-fac .good b{color:#059669}.gen .fl-fac .bad b{color:#e11d48}
.gen .fl-ta{background:#f8fafc;border-color:#cbd5e1;color:#0f2233}.gen .fl-warn{color:#e11d48}
.gen .fl-opt{background:linear-gradient(160deg,#eef2ff,#ecfeff);border-color:#c7d2fe}
.gen .fl-hist{background:#fff}.gen .fl-ev{border-color:#eef2f7}
.gen .fl-wv i{background:#cbd5e1}.gen .fl-prog{background:#e2e8f0}
.gen .fl-phone .lbl{color:#2563eb}
.gen .fl-wv.on i{background:#2563eb}
.gen .fl-confirm{background:rgba(15,34,51,.25)}.gen .fl-cbox{background:#fff;border-color:#d9e3ec;color:#0f2233;box-shadow:0 30px 60px rgba(15,34,51,.25)}
.gdark .fl-cbox{background:#131c2e;border-color:#243149}
/* scenario tags + demo guide */
.scn{margin-left:6px}
.guideBtn{position:absolute;right:36px;bottom:16px;z-index:40;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:11px;border:1px solid #d9e3ec;background:#fff;color:#5b21b6;margin-right:12px}
.guideBtn:hover{border-color:#a78bfa}
.thBtn{width:38px;height:38px;border-radius:11px;border:1px solid #d9e3ec;background:#fff;display:grid;place-items:center;font-size:16px;margin-right:12px}

<script>
/* ================= dates & range ================= */
const TODAY=new Date(2026,10,19);
const D=(y,m,d)=>new Date(y,m,d);const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>add(d,-((d.getDay()+6)%7));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmt=d=>`${MON[d.getMonth()]} ${d.getDate()}`,fmtL=d=>`${DOW[d.getDay()]}, ${fmt(d)}`;
const PUBLISHED_TO=D(2026,11,6); /* schedule published through Sun Dec 6 */
const HOLI={'2026-11-26':'Thanksgiving'};
const T={scale:'week',anchor:monday(TODAY)};
function range(){if(T.scale==='day')return [T.anchor,T.anchor];if(T.scale==='week'){const s=monday(T.anchor);return [s,add(s,6)]}const s=monday(T.anchor);return [s,add(s,34)]}
const inR=(d,[a,b])=>d>=a&&d<=b;

/* ================= gaps model ================= */
const SHIFT={Day:'8:00 AM – 4:00 PM',Evening:'4:00 PM – 12:00 AM',Night:'10:00 PM – 6:00 AM'};
const ROLE={sup:'Support Agent',ops:'Operations Associate',fac:'Facilities Tech',sec:'Security Officer',rec:'Receptionist',fld:'Field Technician',it:'On-call Engineer',log:'Logistics Associate'};
const LOC={sup:'Support Center · Floor 2',ops:'Building A',fac:'Campus',sec:'Main Entrance',rec:'Main Lobby',fld:'North Region',it:'Remote',log:'Dock 3'};
const TPL={sup:[14,8,2],ops:[16,12,10],fac:[6,3,2],sec:[6,6,4],rec:[3,1,0],fld:[10,2,0],it:[4,2,1],log:[10,6,4]};
const POOL={sup:['Mira Patel','Sam Ortiz','Ana Ruiz','Ben Shaw'],ops:['Lee Moss','Chris Dunn','Pat Rivera','Uma Rao'],fac:['Gil Ford','Ivy Tran'],sec:['Kai Lowe','Dana Fox','Rex Moon'],rec:['Rae Quinn','Jordan Lee'],
 fld:['Avery Kim','Casey Brooks','Lou Grant'],it:['Jamie Fox','Robin Lee','Nat Cole'],log:['Robin Hale','Tess Ward','Omar Diaz']};
const G0=[ /* date, team, shift, people short, request id for the weekend requests */
 ['2026-11-20','log','Evening',1],
 ['2026-11-21','sup','Day',3,'sup'],['2026-11-21','rec','Day',1,'rec'],['2026-11-21','sec','Evening',2,'sec'],['2026-11-21','ops','Night',4,'ops'],['2026-11-21','it','Night',1,'it'],['2026-11-22','fld','Day',2,'fld'],
 ['2026-11-26','sup','Day',3],['2026-11-26','ops','Day',2],['2026-11-26','rec','Day',1],['2026-11-27','sup','Day',2],['2026-11-27','log','Day',2],
 ['2026-11-28','sec','Evening',1],['2026-11-28','ops','Night',2],['2026-11-29','fld','Day',1],['2026-12-02','it','Night',1],['2026-12-05','sec','Evening',1],['2026-12-05','ops','Night',1],['2026-12-06','fld','Day',1],
 ['2026-12-12','sec','Evening',1],['2026-12-12','ops','Night',2],['2026-12-13','sup','Day',1],['2026-12-16','it','Night',1],['2026-12-19','sec','Evening',1],['2026-12-19','ops','Night',2],['2026-12-19','log','Day',1],['2026-12-20','fld','Day',1]];
const pd=k=>{const [y,m,d]=k.split('-').map(Number);return D(y,m-1,d)};
const GAPS=G0.map(([k,team,shift,n,rid])=>{const date=pd(k);const proj=date>PUBLISHED_TO;let id=rid;
  if(!id&&!proj){id=`${team}-${k}-${shift}`;const p=POOL[team];const dl=fmtL(date);
    const cands=p.slice(0,n+1).map((nm,i)=>({name:nm,from:team,note:i<n?'Available · under 40 hrs':'Asked to skip holiday shifts',ok:true,resp:i<n?'accept':'decline',fit:92-i*3,n:1}));
    if(p[n+1])cands.push({name:p[n+1],from:team,note:'Already scheduled that day',ok:false,resp:null,fit:0,n:1});
    REQ[id]={dept:team,deptName:TEAMS[team].n,c:TEAMS[team].c,callout:`${TEAMS[team].n} needs ${n} ${ROLE[team].toLowerCase()}${n>1?'s':''} on ${dl}, ${SHIFT[shift].replace(' – ',' to ')}.`,
      hl:[[`${n} ${ROLE[team].toLowerCase()}${n>1?'s':''}`,'need'],[dl,'when']],role:ROLE[team],loc:LOC[team],when:`${DOW[date.getDay()]} ${fmt(date)} · ${SHIFT[shift]}`,need:n,quals:[],incentive:0,cands}}
  return {k,date,team,shift,n,id,proj}});
const stOf=id=>REQ[id]&&REQ[id].st;const status=g=>g.proj?'PROJECTED':stOf(g.id)?stOf(g.id).status:'DRAFT';
const filled=g=>g.proj||!stOf(g.id)?0:stOf(g.id).assigned.reduce((a,c)=>a+c.n,0);
const left=g=>Math.max(0,g.n-filled(g));
const doneS=s=>s==='FILLED'||s==='UNABLE_TO_FILL';
const SL={DRAFT:'Draft',PENDING_APPROVAL:'Pending approval',READY_FOR_OUTREACH:'Ready',OUTREACH_IN_PROGRESS:'Offers out',PARTIALLY_FILLED:'Partially filled',FILLED:'Filled',UNABLE_TO_FILL:'Unable to fill',PROJECTED:'Projected',DECISION:'Decision'};
const gapsIn=r=>GAPS.filter(g=>inR(g.date,r));
const openIn=r=>gapsIn(r).reduce((a,g)=>a+left(g),0);
const decided={};const decIn=r=>DECISIONS.filter(d=>!decided[d.id]&&(d.id==='ot'?inR(D(2026,10,21),r):inR(D(2026,10,21),r)));
function needIn([a,b]){let t=0;for(let d=new Date(a);d<=b;d=add(d,1))Object.values(TPL).forEach(v=>t+=v[0]+v[1]+v[2]);return t}
const covIn=r=>{const n=needIn(r);return Math.round((1-openIn(r)/n)*1000)/10};

/* ================= people ================= */
const PEOPLE=(()=>{const L=[];const seen=new Set();let sd=5;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
  const CERT={sup:['Product training','Phone system'],ops:['Equipment certified','Forklift'],fac:['HVAC','Electrical'],sec:['Guard license','First aid'],rec:['Visitor system'],fld:['Driver’s license','Level 2'],it:['Admin access','On-call'],log:['Forklift','Hazmat']};
  Object.entries(POOL).forEach(([t,ns])=>ns.forEach(n=>add1(n,t)));
  Object.values(REQ).forEach(r=>r.cands.forEach(c=>add1(c.name,c.from==='agency'?r.dept:c.from)));
  function add1(n,t){if(seen.has(n))return;seen.add(n);const h=Math.round(18+rnd()*24);L.push({n,t,role:ROLE[t],h,certs:CERT[t].slice(0,1+Math.floor(rnd()*CERT[t].length)),sat:rnd()>.35,sun:rnd()>.45,pto:n==='Taylor Ng',last:Math.floor(rnd()*28)+1})}
  return L.sort((a,b)=>a.n.localeCompare(b.n))})();

/* ================= views & carousel ================= */
const VIEWS=[['ov','Overview','M3 12h4l3-8 4 16 3-8h4'],['sh','Open shifts','M4 6h16M4 12h16M4 18h10'],['cal','Calendar','M4 5h16v15H4zM4 10h16M9 3v4M15 3v4'],['pp','People','M8 11a3 3 0 100-6 3 3 0 000 6zM2 20c0-3 3-5 6-5s6 2 6 5M16 11a3 3 0 100-6M22 20c0-3-2-5-5-5'],['ac','Activity','M12 7v5l3 3M12 21a9 9 0 110-18 9 9 0 010 18z']];
const S={view:0,f:{q:'',team:'all',st:'all',sh:'all'},sel:new Set(),p:{q:'',team:'all',sat:false,sun:false,ot:false,sort:'n',dir:1},a:{team:'all',type:'all'},cal:{team:'all'}};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2);
const icon=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>`;
function mount(){
  $('#stage').innerHTML=VIEWS.map((v,i)=>`<div class="panel" data-i="${i}"><div class="in" id="v-${v[0]}"></div></div>`).join('');
  $('#hnav').innerHTML=`<div class="ind"></div>`+VIEWS.map((v,i)=>`<button data-v="${i}">${icon(v[2])}${v[1]}${v[0]==='sh'?'<span class="badge" id="shBadge"></span>':''}</button>`).join('');
  $$('#hnav button').forEach(b=>b.onclick=()=>go(+b.dataset.v));
  $$('.panel').forEach(p=>p.addEventListener('click',()=>{if(p.classList.contains('off'))go(+p.dataset.i)},true));
  addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')go((S.view+1)%VIEWS.length);if(e.key==='ArrowLeft')go((S.view+VIEWS.length-1)%VIEWS.length)});
  DM.mount($('#dmSlot'),{light:true});DM.on(()=>{renderAll();toast(DM.roster?'Roster only: gaps are measured against your staffing template':'Ops data on: gaps are measured against forecast demand')});
  renderAll();layout(true)}
function go(i){S.view=i;layout()}
function layout(instant){const n=VIEWS.length;
  $$('.panel').forEach(p=>{const i=+p.dataset.i;if(instant)p.style.transition='none';let o=((i-S.view)%n+n)%n;if(o>2)o-=n;const a=Math.abs(o),sg=Math.sign(o);
    /* the centered panel gets no 3D transform at all, so its text renders crisp instead of as a scaled texture */

  else{const days=[...Array(35)].map((_,i)=>add(r[0],i));body=`<div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="h">${x}</div>`).join('')}
    ${days.map(d=>{const gs=GAPS.filter(g=>g.k===key(d)&&(S.cal.team==='all'||g.team===S.cal.team));const o=gs.reduce((a,g)=>a+left(g),0);const pj=d>PUBLISHED_TO;
      return `<div class="day ${o?(pj?'pj':o>4?'l3':o>2?'l2':'l1'):''} ${key(d)===key(TODAY)?'today':''} ${d<TODAY?'past':''}" data-day="${key(d)}"><div class="d">${d.getDate()===1||d===days[0]?MON[d.getMonth()]+' ':''}${d.getDate()}</div>${o?`<span class="n">${o}</span>`:''}
       <div class="tm">${[...new Set(gs.filter(g=>left(g)).map(g=>g.team))].map(t=>`<i style="background:${TEAMS[t].c}" title="${TEAMS[t].n}"></i>`).join('')}</div>${HOLI[key(d)]?`<div class="hl">${HOLI[key(d)]}</div>`:''}</div>`}).join('')}</div>
    <div class="legend"><span><i style="background:#ffe0e4"></i>Gaps on the published schedule</span><span><i style="background:#fff4e6;border:1px dashed #fdba74"></i>Projected (not published yet)</span><span>Dots show which teams are short</span></div>`}
  el.innerHTML=head+body+(sc!=='month'&&DM.roster?`<div class="dmHint"><span class="dmBadge">Roster only</span>“Needed” comes from your staffing template. Switch to Ops data to see a demand forecast row.</div>`:'');
  $('#calT',el).onchange=e=>{S.cal.team=e.target.value;vCal()};
  $$('[data-rev]',el).forEach(b=>b.onclick=()=>review(b.dataset.rev));$$('[data-pj]',el).forEach(b=>b.onclick=()=>toast('Projected gap: the schedule isn’t published yet, so there’s nobody to message. I’ll draft it when it is.'));
  $$('[data-day]',el).forEach(b=>b.onclick=()=>drillDay(pd(b.dataset.day)))}

/* ================= people ================= */
function vPeople(){const el=$('#v-pp');const p=S.p;let rows=PEOPLE.filter(x=>(p.team==='all'||x.t===p.team)&&(!p.sat||x.sat&&!x.pto)&&(!p.sun||x.sun&&!x.pto)&&(!p.ot||x.h<38)&&(!p.q||(x.n+' '+TEAMS[x.t].n+' '+x.certs.join(' ')).toLowerCase().includes(p.q.toLowerCase())));
  const by={n:x=>x.n,t:x=>TEAMS[x.t].n,h:x=>x.h,last:x=>x.last};rows.sort((a,b)=>{const A=by[p.sort](a),B=by[p.sort](b);return (A>B?1:A<B?-1:0)*p.dir});
  const th=(k,l)=>`<th class="sort" data-s="${k}">${l}${p.sort===k?`<span class="ar">${p.dir>0?'▲':'▼'}</span>`:''}</th>`;
  const assigned=new Set(Object.values(REQ).flatMap(r=>r.st?r.st.assigned.map(c=>c.name):[]));
  el.innerHTML=`<div class="ph"><div style="flex:1"><h2>People</h2><p>${rows.length} of ${PEOPLE.length} people · hours are this week · the agent only offers shifts to people who pass every rule</p></div></div>
   <div class="tb"><label class="search">${icon('M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4-4')}<input id="ppQ" placeholder="Search name, team or certification" value="${p.q}"></label>
     <select class="sel" id="ppT"><option value="all">All teams</option>${Object.entries(TEAMS).map(([k,t])=>`<option value="${k}" ${p.team===k?'selected':''}>${t.n}</option>`).join('')}</select>
     <div class="chips">${[['sat','Available Sat'],['sun','Available Sun'],['ot','Hide near overtime']].map(([k,l])=>`<button data-k="${k}" class="${p[k]?'on':''}">${l}</button>`).join('')}</div></div>
   <div class="tw"><table><thead><tr>${th('n','Name')}${th('t','Team')}<th>Role</th>${th('h','Hours')}<th>Status</th><th>Certifications</th><th>Sat</th><th>Sun</th>${th('last','Last extra shift')}</tr></thead><tbody>
   ${rows.map(x=>`<tr><td><span class="av2">${ini(x.n)}</span><b>${x.n}</b></td><td><span class="dot" style="background:${TEAMS[x.t].c}"></span>${TEAMS[x.t].n}</td><td>${x.role}</td>
     <td><div class="hrs"><i><u class="${x.h>=38?'hot':''}" style="width:${Math.min(100,x.h/44*100)}%"></u></i>${x.h}</div></td>
     <td>${x.pto?'<span class="tag no">PTO</span>':assigned.has(x.n)?'<span class="tag ok">Picked up a shift</span>':x.h>=38?'<span class="tag warn">Near overtime</span>':'<span class="tag">Scheduled</span>'}</td>
     <td>${x.certs.map(c=>`<span class="tag">${c}</span>`).join('')}</td><td>${x.sat&&!x.pto?'✓':'<span style="color:#cbd5e1">—</span>'}</td><td>${x.sun&&!x.pto?'✓':'<span style="color:#cbd5e1">—</span>'}</td><td class="num">${x.last} days ago</td></tr>`).join('')}
   </tbody></table>${rows.length?'':'<div class="empty">Nobody matches these filters.</div>'}</div>`;
  $('#ppQ',el).oninput=e=>{p.q=e.target.value;vPeople();const n=$('#ppQ');n.focus();n.setSelectionRange(n.value.length,n.value.length)};
  $('#ppT',el).onchange=e=>{p.team=e.target.value;vPeople()};$$('.chips button',el).forEach(b=>b.onclick=()=>{p[b.dataset.k]=!p[b.dataset.k];vPeople()});
  $$('th.sort',el).forEach(h=>h.onclick=()=>{const k=h.dataset.s;if(p.sort===k)p.dir*=-1;else{p.sort=k;p.dir=1}vPeople()})}

/* ================= activity ================= */
function vActivity(){const el=$('#v-ac');const a=S.a;
  const ty=t=>/assigned|filled|Released/i.test(t)?'assign':/Offer|sent/i.test(t)?'offer':/approv|Returned/i.test(t)?'approve':'other';
  let rows=[];Object.entries(REQ).forEach(([id,r])=>{if(!r.st)return;r.st.hist.forEach(h=>rows.push({team:r.dept,req:`${r.role} · ${r.when.split(' · ')[0].replace(/ \d+:.*/,'')}`,t:h.t,title:h.title,by:h.by,sub:h.sub,ty:ty(h.title)}))});
  Object.entries(decided).forEach(([id,d])=>{const x=DECISIONS.find(z=>z.id===id);rows.push({team:x.team,req:x.t,t:d.t.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),title:'Decision made',by:'Maya Rivers',sub:d.choice,ty:'decision'})});
  rows=rows.filter(x=>(a.team==='all'||x.team===a.team)&&(a.type==='all'||x.ty===a.type));
  el.innerHTML=`<div class="ph"><div style="flex:1"><h2>Activity</h2><p>Every step on every request, newest first. This is the audit trail.</p></div></div>
   <div class="tb"><select class="sel" id="acT"><option value="all">All teams</option>${Object.entries(TEAMS).map(([k,t])=>`<option value="${k}" ${a.team===k?'selected':''}>${t.n}</option>`).join('')}</select>
    <div class="chips">${[['all','All'],['offer','Offers'],['assign','Assignments'],['approve','Approvals'],['decision','Decisions'],['other','Other']].map(([k,l])=>`<button data-k="${k}" class="${a.type===k?'on':''}">${l}</button>`).join('')}</div></div>
   <div class="tw"><table><thead><tr><th>Time</th><th>Team</th><th>Request</th><th>Event</th><th>By</th><th>Detail</th></tr></thead><tbody>
   ${rows.map(x=>`<tr><td class="num">${x.t}</td><td><span class="dot" style="background:${TEAMS[x.team].c}"></span>${TEAMS[x.team].n}</td><td>${x.req}</td><td><b>${x.title}</b></td><td>${x.by}</td><td><small style="margin:0">${x.sub||''}</small></td></tr>`).join('')}
   </tbody></table>${rows.length?'':'<div class="empty">No activity yet. Review a request and every step lands here.</div>'}</div>`;
  $('#acT',el).onchange=e=>{a.team=e.target.value;vActivity()};$$('.chips button',el).forEach(b=>b.onclick=()=>{a.type=b.dataset.k;vActivity()})}

/* ================= demo guide (presenter shortcuts) ================= */
function guide(){let g=$('#guide');if(g){g.remove();return}g=document.createElement('div');g.className='guide';g.id='guide';
  const done=id=>REQ[id]&&REQ[id].st&&['FILLED','UNABLE_TO_FILL'].includes(REQ[id].st.status);
  const items=[['⚖','Your call: Security','3 officers say yes for 2 spots. Policy: avoid overtime.',()=>review('sec'),done('sec')],
    ['⚖','Your call: Field Service','3 technicians say yes for 2 spots. Labor agreement: seniority.',()=>review('fld'),done('fld')],
    ['＋','Bonus round: Operations','Only 2 of 4 say yes. Add a $50 bonus, a second manager approves, re-offer.',()=>review('ops'),done('ops')],
    ['📱','Worker’s phone, start to finish','Any request with “Show what the worker sees” on. Security follows Kai (confirmed); Field Service follows Avery (not picked).',()=>review('sec'),false],
    ['⇄','Decision: Alex Kim booked twice','A schedule clash only a person can settle.',()=>decision(DECISIONS[0]),!!decided.dbl],
    ['⏱','Decision: Chris Dunn at 46 hours','Overtime approval or a swap.',()=>decision(DECISIONS[1]),!!decided.ot],
    ['🗓','Month view: patterns and projected gaps','Thanksgiving, recurring Security gaps, unpublished weeks.',()=>{setScale('month');go(0)},false],
    ['◎','Roster only vs Ops data','Flip the toggle top right. Calendar gets a demand row.',()=>{DM.set(DM.roster?'full':'roster');go(2)},false]];
  g.innerHTML=`<h4>Demo scenarios</h4><p>Jump straight to the moments worth showing. Purple “Your call” and orange “Bonus round” tags mark them in the lists too.</p>
    ${items.map(([ic,t,d,f,dn],i)=>`<div class="gi"><span class="ic">${ic}</span><div class="tx"><b>${t}</b><small>${d}</small></div><button class="btn sm ${dn?'':'pri'}" data-g="${i}">${dn?'Done ✓':'Go'}</button></div>`).join('')}`;
  $('#app').appendChild(g);$$('[data-g]',g).forEach(b=>b.onclick=()=>{g.remove();if(S.view!==0&&+b.dataset.g<6)go(0);if(+b.dataset.g<3&&T.scale==='month')setScale('week',monday(TODAY));items[+b.dataset.g][3]()});
  setTimeout(()=>document.addEventListener('click',function c(e){if(!g.contains(e.target)&&e.target.id!=='guideBtn'){g.remove();document.removeEventListener('click',c)}}),0)}

/* ================= Shifty chat: talk to the agent to get things done ================= */
const CH={open:false,said:false};
function chatOpen(on){CH.open=on;$('#chat').classList.toggle('on',on);if(on){if(!CH.said){CH.said=true;shSay(`Hi Maya. I can find gaps, draft requests, check hours and rules, and walk you through decisions. <b>I draft, you decide:</b> nothing goes out until you say so. What do you need?`)}suggest();setTimeout(()=>$('#dIn').focus(),50)}}
function suggest(){const L=['Cover this weekend','What needs me?','Who’s near overtime?','Show Security','Who can work Saturday?','Look ahead a month'];
  $('#cSug').innerHTML=L.map(t=>`<button>${t}</button>`).join('');$$('#cSug button').forEach(b=>b.onclick=()=>ask(b.textContent))}
function addMsg(html,who){const m=document.createElement('div');m.className='cm '+who;m.innerHTML=html;$('#cMsgs').appendChild(m);$('#cMsgs').scrollTop=1e6;return m}
function shSay(html,acts=[]){const t=addMsg('<i></i><i></i><i></i>','a typing');faceTalk($('#cFace'),900);faceTalk($('#dFace'),900);
  setTimeout(()=>{t.remove();const m=addMsg(html+(acts.length?`<div class="acts">${acts.map((a,i)=>`<button class="btn sm ${i?'':'pri'}" data-i="${i}">${a[0]}</button>`).join('')}</div>`:''),'a');
    $$('[data-i]',m).forEach(b=>b.onclick=()=>{acts[+b.dataset.i][1]()})},650)}
function ask(q){if(!q.trim())return;CH.said=true;chatOpen(true);addMsg(q.replace(/</g,'&lt;'),'u');const v=q.toLowerCase();const r=range();
  const drafts=gapsIn(r).filter(g=>!g.proj&&status(g)==='DRAFT');const team=Object.entries(TEAMS).find(([k,t])=>v.includes(t.n.toLowerCase())||v.includes(t.n.split(' ')[0].toLowerCase()));
  if(/cover|fill|plan|draft|send/.test(v)&&!team){
    if(T.scale==='month')setScale('week',monday(TODAY));const d2=gapsIn(range()).filter(g=>!g.proj&&status(g)==='DRAFT');
    if(!d2.length){shSay('Everything this week is already moving. Want to see where each request stands?',[['Show open shifts',()=>go(1)]]);return}
    shSay(`This week has <b>${d2.reduce((a,g)=>a+g.n,0)} open shifts</b> across ${new Set(d2.map(g=>g.team)).size} teams. I drafted a request for each. We’ll review them together: confirm, send offers, then you pick who works.`,[[`Review all ${d2.length}`,()=>{chatOpen(false);plan(d2.map(g=>g.id))}],['Show me first',()=>go(1)]]);return}
  if(/overtime|ot\b|hours|tired|fatigue/.test(v)){const near=PEOPLE.filter(p=>p.h>=38).sort((a,b)=>b.h-a.h);
    shSay(`<b>${near.length} people</b> are at 38 hours or more this week. I won’t offer them shifts that push past your overtime rule without asking you first.<ul>${near.slice(0,5).map(p=>`<li>${p.n} · ${TEAMS[p.t].n} · ${p.h} hrs</li>`).join('')}</ul>`,[['Open People',()=>{S.p.ot=false;S.p.sort='h';S.p.dir=-1;go(3);vPeople()}],['Hide them from lists',()=>{S.p.ot=true;go(3);vPeople()}]]);return}
  if(/available|who can|free|saturday|sunday|weekend/.test(v)&&/who|avail|free/.test(v)){const sun=/sun/.test(v);const L=PEOPLE.filter(p=>(sun?p.sun:p.sat)&&!p.pto&&p.h<38);
    shSay(`<b>${L.length} people</b> are available ${sun?'Sunday':'Saturday'} and under 38 hours. I’ve filtered People to show them.`,[['Show them',()=>{S.p.sat=!sun;S.p.sun=sun;S.p.ot=true;go(3);vPeople()}]]);return}
  if(team){const [k,t]=team;const gs=gapsIn(range()).filter(g=>g.team===k&&left(g));S.f.team=k;S.f.st='all';vShifts();go(1);
    shSay(gs.length?`${t.n} has <b>${gs.reduce((a,g)=>a+left(g),0)} open</b> in this range. I filtered Open shifts to ${t.n}.${gs.some(g=>Flow.scen(REQ[g.id]).length)?' One of these is a “Your call”: more people may say yes than you need.':''}`:`${t.n} is fully covered in this range.`,
      gs.filter(g=>!g.proj).slice(0,2).map(g=>[`Review ${fmt(g.date)} ${g.shift.toLowerCase()}`,()=>{chatOpen(false);review(g.id)}]));return}
  if(/decision|conflict|clash|double|booked twice/.test(v)){const ds=decIn(r);if(!ds.length){shSay('No open decisions in this range.');return}
    shSay(`${ds.length} decision${ds.length>1?'s':''} need a person, not a request:<ul>${ds.map(d=>`<li>${d.t}</li>`).join('')}</ul>`,ds.map(d=>[d.id==='dbl'?'Alex Kim':'Chris Dunn',()=>{chatOpen(false);decision(d)}]));return}
  if(/month|ahead|next week|future|thanksgiving|holiday|pattern/.test(v)){setScale('month');go(0);
    shSay('Here are the next 5 weeks. At this range I show patterns instead of single shifts. The big ones: <b>Thanksgiving week</b> is short in Support and Operations, and <b>Security</b> is short almost every weekend.',[['Show Thanksgiving week',()=>drillWeek(D(2026,10,23))],['Open the calendar',()=>go(2)]]);return}
  if(/need|todo|to do|status|left|summary|what.*(happen|going)/.test(v)){const open=openIn(r),ds=decIn(r).length,dr=drafts.length;
    shSay(`${rangeLabel()}: <b>${open} open shifts</b>. ${dr} request${dr===1?' is':'s are'} drafted and waiting on you${ds?`, plus ${ds} decision${ds>1?'s':''}`:''}.`,[[dr?'Review the plan':'Show open shifts',()=>{if(dr){chatOpen(false);plan(drafts.map(g=>g.id))}else go(1)}],['Show decisions',()=>ask('decisions')]]);return}
  if(/calendar|schedule|grid/.test(v)){go(2);shSay('Here’s the calendar for '+rangeLabel()+'. Red cells are gaps; click one to review it.');return}
  shSay('I can help with coverage: filling gaps, checking hours and availability, decisions, and looking ahead. Try one of these:');}
(function(){$('#dFace').onclick=()=>chatOpen(!CH.open);$('#cX').onclick=()=>chatOpen(false);
  $('#dForm').onsubmit=e=>{e.preventDefault();const v=$('#dIn').value;$('#dIn').value='';ask(v)};
  $('#dIn').onfocus=()=>{if(!CH.open)setTimeout(()=>{if(!CH.open&&!$('#dIn').value)chatOpen(true)},150)};
  const tips=['Ask me anything, or tell me what to do','Try “cover this weekend”','Try “who’s near overtime?”','Try “show Security”'];let ti=0;
  setInterval(()=>{if(CH.open)return;ti=(ti+1)%tips.length;const t=$('#dTip');if(t){t.style.opacity=0;setTimeout(()=>{t.textContent=tips[ti];t.style.opacity=1},250)}},4500)})();
function fit(){const k=Math.min(innerWidth/1600,innerHeight/900),A=document.getElementById('app');A.style.setProperty('--s',k);A.style.setProperty('--x',Math.round((innerWidth-1600*k)/2)+'px');A.style.setProperty('--y',Math.round((innerHeight-900*k)/2)+'px')}addEventListener('resize',fit);fit();
function setTheme(dark){const A=document.getElementById('app');A.classList.toggle('dark',dark);A.classList.toggle('gen',!dark);A.classList.toggle('gdark',dark);
  document.body.style.background=dark?'#0b1220':'#eef3f8';$('#thBtn').textContent=dark?'☀':'☾';const t=$('.dmT');if(t)t.classList.toggle('light',!dark);
  if(location.hash!==(dark?'#dark':'#light'))history.replaceState(null,'',dark?'#dark':'#light')}
const DARK=location.hash!=='#light';if(!/[?&]bg=none/.test(location.search))document.getElementById('app').classList.add('photo');Flow.fullPhone=true;
scaGate(DARK?'dark':'light',()=>{mount();$('#dFace').innerHTML=agentFace();$('#cFace').innerHTML=agentFace();setTheme(DARK);$('#thBtn').onclick=()=>setTheme(!$('#app').classList.contains('dark'));$('#guideBtn').onclick=guide;setTimeout(()=>faceTalk($('#dFace'),1500),600)});
</script>
